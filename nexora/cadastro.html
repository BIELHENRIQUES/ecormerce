
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | NEXORA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080016;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .cadastro-page {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 5% 20%, rgba(105, 0, 255, .35), transparent 28%),
                radial-gradient(ellipse at 100% 90%, rgba(105, 0, 255, .38), transparent 30%),
                linear-gradient(135deg, #10002b, #050014 55%, #10002b);
        }

        .cadastro-page::before,
        .cadastro-page::after {
            content: "";
            position: absolute;
            width: 650px;
            height: 260px;
            border: 2px solid rgba(145, 0, 255, .8);
            border-radius: 50%;
            transform: rotate(-28deg);
            pointer-events: none;
            filter: drop-shadow(0 0 12px #8500ff);
        }

        .cadastro-page::before {
            top: -130px;
            left: -250px;
            box-shadow:
                0 25px 0 rgba(100, 0, 255, .15),
                0 50px 0 rgba(100, 0, 255, .12),
                0 75px 0 rgba(100, 0, 255, .10);
        }

        .cadastro-page::after {
            right: -300px;
            bottom: -130px;
            box-shadow:
                0 -25px 0 rgba(100, 0, 255, .15),
                0 -50px 0 rgba(100, 0, 255, .12),
                0 -75px 0 rgba(100, 0, 255, .10);
        }

        .cadastro-navbar {
            position: relative;
            z-index: 2;
            min-height: 96px;
            border-bottom: 1px solid #8300ff;
            background: rgba(5, 0, 20, .88);
            box-shadow: 0 2px 15px rgba(125, 0, 255, .15);
        }

        .cadastro-brand {
            color: #fff;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -2px;
            text-decoration: none;
        }

        .cadastro-brand span {
            color: #8b20ff;
        }

        .cadastro-nav-links {
            display: flex;
            align-items: center;
            gap: 45px;
        }

        .cadastro-nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            transition: .3s;
        }

        .cadastro-nav-links a:hover {
            color: #bd83ff;
        }

        .cadastro-nav-links i {
            color: #c17aff;
            margin-right: 9px;
            font-size: 19px;
        }

        .cadastro-enter-link {
            border: 2px solid #a000ff;
            border-radius: 30px;
            padding: 11px 24px;
            color: #d4a5ff;
            text-decoration: none;
            transition: .3s;
        }

        .cadastro-enter-link:hover {
            background: #7900e8;
            color: white;
            box-shadow: 0 0 18px #7900e8;
        }

        .cadastro-content {
            flex: 1;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
        }

        .cadastro-card {
            width: 100%;
            max-width: 630px;
            padding: 30px 40px;
            border: 1px solid #8500ff;
            border-radius: 28px;
            background: rgba(9, 0, 28, .88);
            box-shadow:
                0 0 25px rgba(112, 0, 255, .18),
                inset 0 0 25px rgba(112, 0, 255, .08);
        }

        .cadastro-symbol {
            width: 115px;
            height: 95px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .cadastro-symbol::before {
            content: "";
            position: absolute;
            width: 190px;
            height: 45px;
            border: 2px solid #9d35ff;
            border-radius: 50%;
            transform: rotate(-20deg);
            box-shadow: 0 0 15px rgba(153, 0, 255, .4);
        }

        .cadastro-symbol span {
            position: relative;
            z-index: 1;
            color: #fff;
            font-size: 65px;
            font-weight: 900;
            text-shadow: 0 0 20px #a000ff;
        }

        .cadastro-title {
            text-align: center;
            font-size: 38px;
            font-weight: 800;
            margin: 10px 0;
        }

        .cadastro-title span {
            color: #a52aff;
        }

        .cadastro-subtitle {
            text-align: center;
            color: #b9a9ce;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .cadastro-field {
            position: relative;
            margin-bottom: 20px;
        }

        .cadastro-field > i {
            position: absolute;
            left: 20px;
            top: 19px;
            color: #b17aff;
            font-size: 20px;
            z-index: 1;
        }

        .cadastro-input {
            width: 100%;
            height: 62px;
            padding: 0 55px;
            border: 1px solid #54218a;
            border-radius: 15px;
            outline: none;
            background: rgba(25, 5, 48, .8);
            color: white;
            font-size: 16px;
            transition: .3s;
        }

        .cadastro-input::placeholder {
            color: #b7abc9;
        }

        .cadastro-input:focus {
            border-color: #b13cff;
            box-shadow: 0 0 15px rgba(153, 0, 255, .35);
            background: rgba(42, 5, 80, .75);
            color: white;
        }

        .cadastro-password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #b7abc9;
            font-size: 21px;
            cursor: pointer;
        }

        .cadastro-password-toggle:hover {
            color: #d7aaff;
        }

        .cadastro-hint {
            display: block;
            color: #a99bbd;
            font-size: 12px;
            margin: 7px 0 0 5px;
        }

        .cadastro-message {
            color: #ffb5b5;
        }

        .cadastro-button {
            width: 100%;
            height: 62px;
            border: 1px solid #a000ff;
            border-radius: 30px;
            background: linear-gradient(100deg, #6500e9, #a000ff);
            color: white;
            font-size: 21px;
            font-weight: 700;
            transition: .3s;
        }

        .cadastro-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 22px rgba(151, 0, 255, .65);
            background: linear-gradient(100deg, #7900ff, #b52cff);
        }

        .cadastro-button i {
            margin-right: 10px;
        }

        .cadastro-login-link {
            text-align: center;
            margin-top: 23px;
            margin-bottom: 0;
            color: #c3bbd1;
        }

        .cadastro-login-link a {
            color: #a52aff;
            text-decoration: none;
            font-weight: 600;
        }

        .cadastro-login-link a:hover {
            color: #d4a5ff;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .cadastro-navbar {
                padding: 15px 0;
            }

            .cadastro-brand {
                font-size: 28px;
            }

            .cadastro-nav-links {
                gap: 15px;
                margin-top: 15px;
                justify-content: center;
                flex-wrap: wrap;
            }

            .cadastro-nav-links a {
                font-size: 14px;
            }

            .cadastro-enter-link {
                display: none;
            }

            .cadastro-card {
                padding: 25px 20px;
            }

            .cadastro-title {
                font-size: 30px;
            }

            .cadastro-subtitle {
                font-size: 15px;
            }

            .cadastro-input {
                height: 56px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<div class="cadastro-page">

    <nav class="cadastro-navbar">
        <div class="container-fluid px-4 px-lg-5 d-flex align-items-center justify-content-between flex-wrap">

            <a href="index.html" class="cadastro-brand">
                NEX<span>ORA</span>
            </a>

            <div class="cadastro-nav-links">
                <a href="index.html">
                    <i class="bi bi-house-door-fill"></i>Início
                </a>

                <a href="catalogo.html">
                    <i class="bi bi-bag-fill"></i>Loja
                </a>

                <a href="carrinho.html">
                    <i class="bi bi-cart-fill"></i>Carrinho
                </a>
            </div>

            <a href="login.html" class="cadastro-enter-link">
                <i class="bi bi-person-fill me-2"></i>Entrar
            </a>

        </div>
    </nav>

    <main class="cadastro-content">

        <div class="cadastro-card">

            <div class="cadastro-symbol">
                <span>N</span>
            </div>

            <h1 class="cadastro-title">
                Criar <span>conta!</span>
            </h1>

            <p class="cadastro-subtitle">
                Faça seu cadastro e aproveite a NEXORA
            </p>

            <form id="formCadastro">

                <div class="cadastro-field">
                    <i class="bi bi-person-fill"></i>

                    <input
                        type="text"
                        class="cadastro-input"
                        id="nomeCadastro"
                        placeholder="Nome completo"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="cadastro-field">
                    <i class="bi bi-envelope"></i>

                    <input
                        type="email"
                        class="cadastro-input"
                        id="emailCadastro"
                        placeholder="E-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="cadastro-field">
                    <i class="bi bi-lock-fill"></i>

                    <input
                        type="password"
                        class="cadastro-input"
                        id="senhaCadastro"
                        placeholder="Crie uma senha"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="cadastro-password-toggle"
                        data-target="senhaCadastro"
                        aria-label="Mostrar senha"
                    >
                        <i class="bi bi-eye-slash"></i>
                    </button>

                    <small class="cadastro-hint">
                        Sua senha deve ter pelo menos 8 caracteres.
                    </small>
                </div>

                <div class="cadastro-field">
                    <i class="bi bi-shield-lock-fill"></i>

                    <input
                        type="password"
                        class="cadastro-input"
                        id="confirmarSenha"
                        placeholder="Confirme sua senha"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="cadastro-password-toggle"
                        data-target="confirmarSenha"
                        aria-label="Mostrar senha"
                    >
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>

                <div id="mensagemCadastro" class="cadastro-message mb-3"></div>

                <button type="submit" class="cadastro-button">
                    <i class="bi bi-person-plus-fill"></i>
                    Criar minha conta
                </button>

            </form>

            <p class="cadastro-login-link">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

<script>
    document.querySelectorAll(".cadastro-password-toggle").forEach(function(botao) {

        botao.addEventListener("click", function() {

            const campo = document.getElementById(botao.dataset.target);
            const senhaVisivel = campo.type === "text";

            campo.type = senhaVisivel ? "password" : "text";

            botao.innerHTML = senhaVisivel
                ? '<i class="bi bi-eye-slash"></i>'
                : '<i class="bi bi-eye"></i>';

            botao.setAttribute(
                "aria-label",
                senhaVisivel ? "Mostrar senha" : "Ocultar senha"
            );

        });

    });
</script>

</body>
</html>
