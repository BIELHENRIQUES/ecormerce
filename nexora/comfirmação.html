
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedido confirmado | NEXORA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: #090015;
        }

        /* FUNDO PRINCIPAL */

        .confirmacao-page {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background:
                radial-gradient(ellipse at 50% 45%, rgba(94, 0, 190, 0.28), transparent 48%),
                radial-gradient(ellipse at 0% 0%, rgba(111, 0, 255, 0.65), transparent 30%),
                radial-gradient(ellipse at 100% 100%, rgba(111, 0, 255, 0.55), transparent 28%),
                linear-gradient(135deg, #100020, #080012 60%, #120020);
        }

        /* DETALHES DE LUZ NAS EXTREMIDADES */

        .luz-fundo {
            position: absolute;
            width: 450px;
            height: 450px;
            border: 2px solid rgba(153, 40, 255, 0.45);
            border-radius: 45%;
            transform: rotate(-35deg);
            pointer-events: none;
            box-shadow: 0 0 35px rgba(125, 0, 255, 0.15);
        }

        .luz-esquerda {
            top: -340px;
            left: -180px;
        }

        .luz-direita {
            bottom: -370px;
            right: -170px;
        }

        /* CONTEÚDO */

        .confirmacao-conteudo {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 950px;
            text-align: center;
        }

        /* SACOLA */

        .sacola-area {
            position: relative;
            width: 220px;
            height: 260px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sacola-brilho {
            position: absolute;
            width: 350px;
            height: 140px;
            border: 3px solid #a000ff;
            border-radius: 50%;
            transform: rotate(-18deg);
            box-shadow:
                0 0 12px #a000ff,
                0 0 30px #7b00ff,
                inset 0 0 15px rgba(142, 0, 255, 0.4);
        }

        .sacola {
            position: relative;
            width: 145px;
            height: 170px;
            margin-top: 40px;
            border: 3px solid #9b35ff;
            border-radius: 12px 12px 25px 25px;
            background: linear-gradient(145deg, #300064, #100022 75%);
            transform: perspective(400px) rotateY(-8deg) rotateZ(-3deg);
            box-shadow:
                0 0 20px rgba(145, 0, 255, 0.7),
                0 0 55px rgba(111, 0, 255, 0.4),
                inset 0 0 25px rgba(132, 0, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sacola::before {
            content: "";
            position: absolute;
            width: 65px;
            height: 75px;
            top: -67px;
            left: 36px;
            border: 7px solid #9b35ff;
            border-bottom: none;
            border-radius: 45px 45px 0 0;
            filter: drop-shadow(0 0 8px #8d00ff);
        }

        .sacola-letra {
            font-size: 90px;
            font-weight: 900;
            font-style: italic;
            color: #a000ff;
            text-shadow:
                0 0 10px #a000ff,
                0 0 30px #8a00ff;
        }

        /* SÍMBOLO DE CONFIRMAÇÃO */

        .selo-confirmado {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: linear-gradient(145deg, #7200e9, #310078);
            border: 3px solid #b13cff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 55px;
            font-weight: bold;
            box-shadow:
                0 0 15px #a000ff,
                0 0 35px rgba(139, 0, 255, 0.7);
        }

        /* TEXTOS */

        .confirmacao-titulo {
            font-size: clamp(38px, 7vw, 76px);
            font-weight: 900;
            letter-spacing: -2px;
            margin: 10px 0 18px;
            color: white;
        }

        .confirmacao-titulo span {
            color: #9b35ff;
            text-shadow: 0 0 20px rgba(140, 0, 255, 0.45);
        }

        .confirmacao-descricao {
            font-size: clamp(17px, 2.5vw, 26px);
            color: #e2d8f1;
            line-height: 1.6;
            margin-bottom: 5px;
        }

        .confirmacao-obrigado {
            font-size: clamp(16px, 2.2vw, 24px);
            color: #d3c5e8;
            margin-bottom: 35px;
        }

        .confirmacao-obrigado strong {
            color: #a43bff;
        }

        /* RESUMO DO PEDIDO */

        .pedido-resumo {
            display: none;
            max-width: 520px;
            margin: 25px auto;
            padding: 20px;
            background: rgba(39, 15, 69, 0.8);
            border: 1px solid rgba(157, 75, 255, 0.4);
            border-radius: 16px;
            text-align: left;
        }

        .pedido-resumo h3 {
            color: #c99aff;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .pedido-resumo p {
            color: #d6c9e8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .pedido-resumo strong {
            color: white;
        }

        .pedido-produtos {
            border-top: 1px solid rgba(180, 130, 255, 0.25);
            margin-top: 13px;
            padding-top: 13px;
        }

        /* BOTÃO */

        .botao-loja {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 13px;
            min-width: 390px;
            padding: 20px 35px;
            border: 2px solid #a000ff;
            border-radius: 60px;
            background: linear-gradient(100deg, #350078, #16002e);
            color: white;
            text-decoration: none;
            font-size: 21px;
            font-weight: 700;
            box-shadow:
                0 0 15px rgba(144, 0, 255, 0.5),
                inset 0 0 15px rgba(144, 0, 255, 0.15);
            transition: 0.3s;
        }

        .botao-loja:hover {
            background: linear-gradient(100deg, #7800ed, #350078);
            color: white;
            transform: translateY(-4px);
            box-shadow:
                0 0 20px rgba(144, 0, 255, 0.8),
                0 0 45px rgba(144, 0, 255, 0.35);
        }

        .botao-icone {
            font-size: 25px;
        }

        /* RODAPÉ */

        .confirmacao-footer {
            position: absolute;
            bottom: 18px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #76658f;
            font-size: 12px;
            z-index: 2;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 576px) {
            .confirmacao-page {
                padding: 35px 18px 65px;
            }

            .sacola-area {
                transform: scale(0.8);
                margin-bottom: -15px;
            }

            .confirmacao-titulo {
                letter-spacing: -1px;
            }

            .botao-loja {
                min-width: 0;
                width: 100%;
                padding: 17px 20px;
                font-size: 17px;
            }

            .confirmacao-footer {
                position: relative;
                bottom: auto;
                margin-top: 45px;
            }
        }
    </style>
</head>

<body>

    <main class="confirmacao-page">

        <div class="luz-fundo luz-esquerda"></div>
        <div class="luz-fundo luz-direita"></div>

        <div class="confirmacao-conteudo">

            <!-- ILUSTRAÇÃO DA SACOLA -->
            <div class="sacola-area">

                <div class="sacola-brilho"></div>

                <div class="sacola">
                    <span class="sacola-letra">N</span>
                </div>

                <div class="selo-confirmado">✓</div>

            </div>

            <!-- MENSAGEM -->
            <h1 class="confirmacao-titulo">
                Pagamento <span>Concluído!</span>
            </h1>

            <p class="confirmacao-descricao">
                Seu pedido foi confirmado com sucesso.
            </p>

            <p class="confirmacao-obrigado">
                Obrigado por comprar na <strong>NEXORA!</strong>
            </p>

            <!-- RESUMO DINÂMICO -->
            <div class="pedido-resumo" id="pedidoResumo">

                <h3>Detalhes da compra simulada</h3>

                <p>
                    <strong>Cliente:</strong>
                    <span id="pedidoCliente"></span>
                </p>

                <p>
                    <strong>Pagamento:</strong>
                    <span id="pedidoPagamento"></span>
                </p>

                <p>
                    <strong>Data:</strong>
                    <span id="pedidoData"></span>
                </p>

                <div class="pedido-produtos" id="pedidoProdutos"></div>

                <p class="mt-3 mb-0">
                    <strong>Total:</strong>
                    <span id="pedidoTotal"></span>
                </p>

            </div>

            <!-- VOLTAR PARA A LOJA -->
            <a href="catalogo.html" class="botao-loja">
                <span class="botao-icone">⌂</span>
                Voltar para a Loja
            </a>

        </div>

        <footer class="confirmacao-footer">
            NEXORA STORE — Tecnologia que acompanha você.
            <br>
            Compra demonstrativa para projeto acadêmico.
        </footer>

    </main>

    <script>
        function formatarDinheiro(valor) {
            return Number(valor).toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });
        }

        function escaparHTML(texto) {
            return String(texto).replace(/[&<>"']/g, function (caractere) {
                const caracteres = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return caracteres[caractere];
            });
        }

        function carregarPedido() {
            const pedidoSalvo = sessionStorage.getItem("nexoraPedidoSimulado");

            if (!pedidoSalvo) {
                return;
            }

            try {
                const pedido = JSON.parse(pedidoSalvo);

                document.getElementById("pedidoResumo").style.display = "block";

                document.getElementById("pedidoCliente").textContent =
                    pedido.cliente?.nome || "Não informado";

                document.getElementById("pedidoPagamento").textContent =
                    pedido.pagamento || "Não informado";

                document.getElementById("pedidoData").textContent =
                    pedido.data || "Não informada";

                document.getElementById("pedidoTotal").textContent =
                    formatarDinheiro(pedido.total || 0);

                const areaProdutos = document.getElementById("pedidoProdutos");

                areaProdutos.innerHTML = "<p><strong>Produtos:</strong></p>";

                (pedido.produtos || []).forEach(function (produto) {
                    const linha = document.createElement("p");

                    const quantidade = Math.max(1, Number(produto.quantidade) || 1);
                    const preco = Number(produto.preco) || 0;

                    linha.textContent =
                        `${produto.nome} — ${quantidade} unidade(s) — ${formatarDinheiro(preco * quantidade)}`;

                    areaProdutos.appendChild(linha);
                });

                // Limpa o carrinho depois de recuperar os dados do pedido
                localStorage.removeItem("nexoraCarrinho");

                // Atualiza o contador do carrinho, caso exista
                if (typeof atualizarContadorCarrinho === "function") {
                    atualizarContadorCarrinho();
                }

            } catch (erro) {
                console.error("Não foi possível carregar os dados do pedido.", erro);
            }
        }

        carregarPedido();
    </script>

</body>
</html>
